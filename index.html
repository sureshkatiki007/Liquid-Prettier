<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Prettier</title>
<meta name="description" content="Format Shopify Liquid + HTML in your browser with Prettier and @shopify/prettier-plugin-liquid.">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="70">{%25</text></svg>' />
<style>
  :root{
    --mono: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --arial: arial, tahoma, helvetica, sans-serif;

    --body-bg: #ffffff;
    --panel-bg: #f6f7f9;
    --border: #e2e4e8;
    --text: #24292e;
    --textarea-bg: #f3f5f6;
    --textarea-value: #7e7e7e;
    --output-value: #24292e;
    --muted: #8a8f98;
    --accent: #5c5c5c;
    --error: #ea4335;
    --error-bg: #fdf1f0;

    --btn-bg: #fff;
    --scrollbar-thumb: #767676;
    --content-font: 12px;
  }
  html[data-theme="dark"]{
    --body-bg: #20201f;
    --panel-bg: #20201f;
    --border: #365c8e;
    --text: #d7dde5;
    --textarea-bg: var(--body-bg);
    --textarea-value: #7e7e7e;
    --output-value: #d7dde5;
    --muted: #6b7685;
    --accent: #2c9dee;
    --error: #f7768e;
    --error-bg: #1a1116;

    --btn-bg: #1a212b;
    --scrollbar-thumb: #767676;
  }
  *, *:before, *:after { box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--body-bg);
    color: var(--text);
    font-family: var(--arial);
    font-size: 11px;
    white-space: nowrap;
    display:flex;
    flex-direction:column;
  }

  /* ---------- header (same as JSON Viewer) ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap:15px;
    background: var(--panel-bg);
    padding:5px 15px 6px 15px;
    border-bottom:1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1{
    font-family: var(--sans);
    font-size:16px;
    font-weight:600;
    letter-spacing:0.01em;
    color:var(--accent);
    margin:0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  #version{
    font-family: var(--mono);
    font-size:10px;
    font-weight:400;
    color: var(--muted);
    border:1px solid var(--border);
    border-radius:999px;
    padding:1px 7px;
  }
  .toolbar{
    display:flex;
    align-items:center;
    gap:8px;
    margin:0;
    flex-wrap:wrap;
  }
  button, .file-btn{
    background: var(--btn-bg);
    border:1px solid var(--border);
    color: var(--text);
    font-family: var(--arial);
    font-size:12px;
    padding:6px 12px;
    border-radius:5px;
    cursor:pointer;
    transition: border-color .15s, color .15s;
  }
  button:hover, .file-btn:hover{
    border-color: var(--accent);
    color: var(--accent);
  }
  button.is-on{
    border-color: var(--accent);
    color: var(--accent);
  }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  .font-ctrl{
    display:flex;
    align-items:center;
    gap:4px;
    border:1px solid var(--border);
    border-radius:5px;
    padding:2px 4px;
    background: var(--btn-bg);
  }
  .font-ctrl button{
    border:none;
    padding:4px 4px;
    background: transparent;
  }
  .font-ctrl button:hover{ color: var(--accent); }
  .font-ctrl button:disabled{ opacity:0.35; cursor:not-allowed; color: var(--text); }
  #fontSizeLabel{
    font-size:11px;
    color: var(--muted);
    min-width:20px;
    text-align:center;
    font-family: var(--mono);
  }
  input[type=file]{ display:none; }

  /* ---------- options popover ---------- */
  .options-wrap{ position:relative; }
  #optionsPanel{
    position:absolute;
    right:0;
    top:calc(100% + 6px);
    z-index:10;
    min-width:290px;
    background: var(--panel-bg);
    border:1px solid var(--border);
    border-radius:5px;
    padding:10px 12px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);
    display:none;
    font-size:14px;
  }
  #optionsPanel.open{ display:block; }
  #optionsPanel .opt{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:5px 0;
    cursor:pointer;
  }
  #optionsPanel .opt + .opt{ border-top:1px dotted var(--border); }
  #optionsPanel code{
	font-family: var(--mono);
	font-family: Arial, Helvetica, sans-serif;
	font-size:14px;
	color: var(--text); 
  }
  #optionsPanel input[type=number], #optionsPanel select{
    background: var(--btn-bg);
    color: var(--text);
    border:1px solid var(--border);
    border-radius:5px;
    font-family: var(--mono);
    font-size:14px;
    padding:3px 6px;
  }
  #optionsPanel input[type=number]{ width:72px; }
  #optionsPanel input[type=checkbox]{
    accent-color: var(--accent);
    width:15px;
    height:15px;
    margin:0;
    flex-shrink:0;
    cursor:pointer;
  }
  #optionsPanel .links{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--border);
    display:flex;
    gap:12px;
  }
  #optionsPanel .links a{ color: var(--muted); text-decoration:none; }
  #optionsPanel .links a:hover{ color: var(--accent); }

  /* ---------- error bar (same as JSON Viewer) ---------- */
  #error{
    color: var(--error);
    padding:10px 16px;
    font-family: var(--mono);
    font-size:var(--content-font);
    line-height:1.5;
    border-bottom:1px solid var(--border);
    display:none;
    background: var(--error-bg);
    white-space: pre-wrap;
    max-height:30vh;
    overflow:auto;
  }

  /* ---------- panels + dragger (same as JSON Viewer) ---------- */
  main{
    flex:1;
    display:flex;
    min-height:0;
  }
  .panel{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background: var(--textarea-bg);
  }
  .dragger{
    width:6px;
    flex-shrink:0;
    background: var(--border);
    cursor: col-resize;
    position: relative;
    transition: background .15s;
  }
  .dragger:hover, .dragger.dragging{ background: var(--accent); }
  .dragger::after{
    content:'';
    position:absolute;
    top:0; bottom:0;
    left:-3px; right:-3px;
  }
  body.resizing{ cursor: col-resize; user-select: none; }
  body.resizing .panel{ pointer-events: none; }

  .editor-wrap{
    flex:1;
    min-height:0;
    display:flex;
    background: var(--textarea-bg);
    overflow:hidden;
  }
  .line-numbers{
    flex-shrink:0;
    padding:10px 8px 10px 12px;
    font-family: var(--mono);
    font-size: var(--content-font);
    line-height:1.5;
    color: var(--muted);
    text-align:right;
    white-space:pre;
    overflow:hidden;
    user-select:none;
    border-right:1px solid var(--border);
  }
  textarea, #output{
    flex:1;
    min-width:0;
    margin:0;
    background: var(--textarea-bg);
    border:none;
    outline:none;
    resize:none;
    font-family: var(--mono);
    font-size: var(--content-font);
    line-height:1.5;
    padding:10px;
    white-space: pre;
    overflow:auto;
    tab-size:2;
  }
  textarea{ color: var(--textarea-value); }
  #output{ color: var(--output-value); }

  #output::-webkit-scrollbar, textarea::-webkit-scrollbar{ width:0px; height:0px; }
  #output:hover::-webkit-scrollbar, textarea:hover::-webkit-scrollbar{ width:6px; height:6px; }
  #output::-webkit-scrollbar-thumb, textarea::-webkit-scrollbar-thumb{ cursor:pointer; background: var(--scrollbar-thumb); border-radius:0px; }

  @media (max-width: 760px){
    header{ justify-content:center; position:relative; }
    .options-wrap{ position:static; }
    #optionsPanel{ left:16px; right:16px; top:calc(100% + 4px); min-width:0; }
    #optionsPanel .opt code{ white-space:normal; overflow-wrap:anywhere; }
    main{ flex-direction:column; }
    .dragger{ display:none; }
    .panel{ min-height:240px; }
    .panel + .dragger + .panel{ border-top:6px solid var(--border); }
  }
</style>
</head>
<body>
  <header>
    <div class="toolbar">
      <label class="file-btn">Open File<input type="file" id="fileInput" accept=".liquid,.html,.htm,.txt,text/plain,text/html"></label>
      <button id="format4Btn" type="button">Format 4</button>
      <button id="format2Btn" type="button">Format 2</button>
      <button id="copyBtn" type="button">Copy</button>
      <button id="shareBtn" type="button">Copy link</button>
      <button id="clearBtn" type="button">Clear</button>
    </div>

    <h1>Liquid Prettier <span id="version">…</span></h1>

    <div class="toolbar">
      <button id="resetBtn" type="button">Example</button>
      <div class="options-wrap">
        <button id="optionsBtn" type="button" aria-expanded="false" aria-controls="optionsPanel">Options ▾</button>
        <form id="optionsPanel" onsubmit="return false">
          <label class="opt"><code>--print-width</code><input type="number" name="printWidth" min="120" max="320" value="250" step="10"></label>
          <label class="opt"><code>--use-tabs</code><input type="checkbox" name="useTabs"></label>
          <label class="opt"><code>--html-whitespace-sensitivity</code>
            <select name="htmlWhitespaceSensitivity">
              <option value="css" selected>css</option>
              <option value="strict">strict</option>
              <option value="ignore">ignore</option>
            </select>
          </label>
          <label class="opt"><code>--single-quote</code><input type="checkbox" name="singleQuote"></label>
          <label class="opt"><code>--liquid-single-quote</code><input type="checkbox" name="liquidSingleQuote" checked></label>
          <label class="opt"><code>--embedded-single-quote</code><input type="checkbox" name="embeddedSingleQuote" checked></label>
          <label class="opt"><code>--single-line-link-tags</code><input type="checkbox" name="singleLineLinkTags"></label>
          <label class="opt"><code>--indent-schema</code><input type="checkbox" name="indentSchema"></label>
          <div class="links">
            <a href="https://shopify.dev/docs/storefronts/themes/tools/liquid-prettier-plugin" target="_blank" rel="noopener">Docs</a>
            <a href="https://github.com/Shopify/theme-tools/tree/main/packages/prettier-plugin-liquid" target="_blank" rel="noopener">GitHub</a>
          </div>
        </form>
      </div>
      <span class="font-ctrl">
        <button id="fontDec" type="button" title="Decrease font size">A⁻</button>
        <span id="fontSizeLabel">12</span>
        <button id="fontInc" type="button" title="Increase font size">A⁺</button>
      </span>
      <button id="themeToggle" type="button">🌙 Dark</button>
    </div>
  </header>

  <div id="error"></div>

  <main>
    <div class="panel" id="leftPanel">
      <div class="editor-wrap">
        <div class="line-numbers" id="inputLines" aria-hidden="true">1</div>
        <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Liquid input" placeholder="Paste Liquid / HTML here…"></textarea>
      </div>
    </div>
    <div class="dragger" id="dragger"></div>
    <div class="panel" id="rightPanel">
      <div class="editor-wrap">
        <div class="line-numbers" id="outputLines" aria-hidden="true">1</div>
        <pre id="output" aria-live="polite" aria-label="Formatted output"></pre>
      </div>
    </div>
  </main>

  <!--
    Per Shopify docs, "Use the plugin in the browser":
    https://shopify.dev/docs/storefronts/themes/tools/liquid-prettier-plugin#use-the-plugin-in-the-browser
  -->
  <script src="https://unpkg.com/prettier/standalone.js"></script>
  <script src="https://unpkg.com/@shopify/prettier-plugin-liquid/standalone.js"></script>

<script>
const EXAMPLE = `<ul class="container">
{% for el in col %}<li class="{% cycle 'odd', 'even' %}" id="something" data-prop="some value">
 <div class="item-container"> <label>{{ el.value }}</label>
 {% assign alt = el.featured_image.alt | replace: 'vanilla', 'chocolate' | upcase %}
 {{ el.featured_image | image_url | image_tag }}
 </div>
 </li> {% endfor %}
</ul>
`;

const DEFAULTS = {
  printWidth: 250,
  tabWidth: 2,
  useTabs: false,
  htmlWhitespaceSensitivity: 'css',
  singleQuote: false,
  liquidSingleQuote: true,
  embeddedSingleQuote: true,
  singleLineLinkTags: false,
  indentSchema: false,
};

const $ = (id) => document.getElementById(id);
const input = $('input');
const output = $('output');
const inputLines = $('inputLines');
const outputLines = $('outputLines');
const errorBox = $('error');
const form = $('optionsPanel');
const optionsBtn = $('optionsBtn');
const format2Btn = $('format2Btn');
const format4Btn = $('format4Btn');
const themeToggle = $('themeToggle');
const fontDec = $('fontDec');
const fontInc = $('fontInc');
const fontSizeLabel = $('fontSizeLabel');

let options = { ...DEFAULTS };
let contentFontSize = 12;

// ---------- per-viewer preferences (theme, font size) ----------
function loadPref(key, fallback){
  try { const v = localStorage.getItem('lp-' + key); return v === null ? fallback : v; } catch { return fallback; }
}
function savePref(key, value){
  try { localStorage.setItem('lp-' + key, value); } catch {}
}

// ---------- theme ----------
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  themeToggle.textContent = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
}
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  savePref('theme', next);
});

// ---------- font size ----------
function applyFontSize(){
  contentFontSize = Math.min(20, Math.max(10, contentFontSize));
  document.documentElement.style.setProperty('--content-font', contentFontSize + 'px');
  fontSizeLabel.textContent = contentFontSize + '';
  fontDec.disabled = contentFontSize <= 10;
  fontInc.disabled = contentFontSize >= 20;
  savePref('font', contentFontSize);
}
fontDec.addEventListener('click', () => { contentFontSize -= 1; applyFontSize(); });
fontInc.addEventListener('click', () => { contentFontSize += 1; applyFontSize(); });

// ---------- dragger ----------
(function initDragger(){
  const dragger = $('dragger');
  const leftPanel = $('leftPanel');
  const rightPanel = $('rightPanel');
  let dragging = false;
  dragger.addEventListener('mousedown', (e) => {
    dragging = true;
    dragger.classList.add('dragging');
    document.body.classList.add('resizing');
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const rect = leftPanel.parentElement.getBoundingClientRect();
    let percent = ((e.clientX - rect.left) / rect.width) * 100;
    percent = Math.min(100, Math.max(0, percent));
    leftPanel.style.flex = `0 0 ${percent}%`;
    rightPanel.style.flex = '1 1 auto';
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    dragger.classList.remove('dragging');
    document.body.classList.remove('resizing');
  });
})();

// ---------- line numbers ----------
function renderLineNumbers(el, text, scroller){
  if (text === '') { el.textContent = ''; return; }
  const count = text.replace(/\n$/, '').split('\n').length;
  let out = '';
  for (let i = 1; i <= count; i++) out += i + (i < count ? '\n' : '');
  el.textContent = out;
  el.scrollTop = scroller.scrollTop;
}
input.addEventListener('scroll', () => { inputLines.scrollTop = input.scrollTop; });
output.addEventListener('scroll', () => { outputLines.scrollTop = output.scrollTop; });

// ---------- error bar ----------
function showError(msg){
  errorBox.style.display = msg ? 'block' : 'none';
  errorBox.textContent = msg || '';
}

// ---------- state <-> URL (shareable links) ----------
function encodeState(){
  const diff = {};
  for (const k in options) if (options[k] !== DEFAULTS[k]) diff[k] = options[k];
  return btoa(unescape(encodeURIComponent(JSON.stringify({ code: input.value, options: diff }))));
}
function decodeState(){
  try {
    const hash = location.hash.slice(1);
    return hash ? JSON.parse(decodeURIComponent(escape(atob(hash)))) : null;
  } catch { return null; }
}

// ---------- options -> UI ----------
function renderOptions(){
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') el.checked = !!options[el.name];
    else el.value = options[el.name];
  }
  format2Btn.classList.toggle('is-on', options.tabWidth === 2);
  format4Btn.classList.toggle('is-on', options.tabWidth === 4);
  format2Btn.setAttribute('aria-pressed', String(options.tabWidth === 2));
  format4Btn.setAttribute('aria-pressed', String(options.tabWidth === 4));
  input.style.tabSize = output.style.tabSize = options.tabWidth;
}

// ---------- formatting ----------
let runId = 0;
async function format(){
  const id = ++runId;
  renderLineNumbers(inputLines, input.value, input);
  if (!input.value.trim()) {
    output.textContent = '';
    renderLineNumbers(outputLines, '', output);
    showError('');
    return;
  }
  try {
    const result = await prettier.format(input.value, {
      parser: 'liquid-html',
      plugins: [prettierPluginLiquid],
      ...options,
    });
    if (id !== runId) return;
    output.textContent = result;
    renderLineNumbers(outputLines, result, output);
    showError('');
  } catch (err) {
    if (id !== runId) return;
    showError('Format error: ' + String(err && err.message ? err.message : err));
  }
}

let timer;
const scheduleFormat = () => { clearTimeout(timer); timer = setTimeout(format, 200); };
input.addEventListener('input', () => {
  renderLineNumbers(inputLines, input.value, input);
  scheduleFormat();
});

// Tab key inserts indentation instead of leaving the field
input.addEventListener('keydown', (e) => {
  if (e.key !== 'Tab' || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
  e.preventDefault();
  const indent = options.useTabs ? '\t' : ' '.repeat(options.tabWidth);
  input.setRangeText(indent, input.selectionStart, input.selectionEnd, 'end');
  scheduleFormat();
});

// ---------- toolbar ----------
function setTabWidth(n){ options.tabWidth = n; renderOptions(); format(); }
format2Btn.addEventListener('click', () => setTabWidth(2));
format4Btn.addEventListener('click', () => setTabWidth(4));

form.addEventListener('input', (e) => {
  const el = e.target;
  if (!el.name) return;
  if (el.type === 'checkbox') options[el.name] = el.checked;
  else if (el.type === 'number') {
    const n = parseInt(el.value, 10);
    if (Number.isNaN(n)) return;
    options[el.name] = n;
  } else options[el.name] = el.value;
  renderOptions();
  format();
});

optionsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = form.classList.toggle('open');
  optionsBtn.setAttribute('aria-expanded', String(open));
  optionsBtn.classList.toggle('is-on', open);
});
document.addEventListener('click', (e) => {
  if (!form.classList.contains('open') || form.contains(e.target)) return;
  form.classList.remove('open');
  optionsBtn.setAttribute('aria-expanded', 'false');
  optionsBtn.classList.remove('is-on');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && form.classList.contains('open')) optionsBtn.click();
});

function flash(btn, text){
  const old = btn.textContent;
  btn.textContent = text;
  setTimeout(() => (btn.textContent = old), 1000);
}
async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); flash(btn, 'Copied!'); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); flash(btn, 'Copied!'); } catch { flash(btn, 'Copy failed'); }
    ta.remove();
  }
}
$('copyBtn').addEventListener('click', (e) => copyText(output.textContent, e.currentTarget));
// The code + options are added to a link only when "Copy link" is clicked; the address bar stays clean.
$('shareBtn').addEventListener('click', (e) => {
  const link = location.origin + location.pathname + location.search + '#' + encodeState();
  copyText(link, e.currentTarget);
});

$('clearBtn').addEventListener('click', () => { input.value = ''; format(); input.focus(); });
$('resetBtn').addEventListener('click', () => {
  input.value = EXAMPLE;
  options = { ...DEFAULTS };
  renderOptions();
  format();
});

$('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => { input.value = evt.target.result; format(); };
  reader.readAsText(file);
  e.target.value = '';
});

// ---------- init ----------
applyTheme(loadPref('theme', 'light'));
contentFontSize = parseInt(loadPref('font', '12'), 10) || 12;
applyFontSize();

// The doc's unpkg links load the latest release, so show the version they resolved to.
fetch('https://unpkg.com/@shopify/prettier-plugin-liquid/package.json')
  .then((r) => r.json())
  .then((pkg) => { $('version').textContent = 'v' + pkg.version; })
  .catch(() => { $('version').textContent = 'latest'; });

if (typeof prettier === 'undefined' || typeof prettierPluginLiquid === 'undefined') {
  showError('Could not load Prettier or the Liquid plugin from the CDN. Check your connection and reload.');
  document.querySelectorAll('header button, header input, header select').forEach((el) => {
    if (el !== themeToggle && el !== fontDec && el !== fontInc) el.disabled = true;
  });
} else {
  const saved = decodeState();
  input.value = saved && typeof saved.code === 'string' ? saved.code : EXAMPLE;
  if (saved && saved.options) options = { ...DEFAULTS, ...saved.options };
  // A shared link was opened: load its code, then clean the address bar.
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  renderOptions();
  format();
}
</script>
</body>
</html>
